name: Windows desktop

on:
  push:
    branches: [main, 'desktop/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[desktop,dev,build]"
      - name: Test modules and GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Bundle executable
        run: python -m PyInstaller --noconfirm --clean GHOST-TOOLS.spec
      - name: Smoke test bundled application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/GHOST-TOOLS/GHOST-TOOLS.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Application startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Application exited with $($process.ExitCode)" }
      - name: Package portable application and checksums
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/GHOST-TOOLS/
          Copy-Item THIRD-PARTY-NOTICES.md dist/GHOST-TOOLS/
          Compress-Archive -Path dist/GHOST-TOOLS -DestinationPath dist/GHOST-TOOLS-windows-x64.zip
          $hash = (Get-FileHash dist/GHOST-TOOLS-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  GHOST-TOOLS-windows-x64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GHOST-TOOLS-windows-x64
          path: |
            dist/GHOST-TOOLS-windows-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GHOST-TOOLS-windows-x64
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --verify-tag --title "GHOST//TOOLS $TAG" --generate-notes
          gh release upload "$TAG" release/* --clobber
